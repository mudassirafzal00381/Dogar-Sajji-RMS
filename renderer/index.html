  </div>`);
}

async function confirmPurgeLastTwoDaysData(silent = false) {
  try {
    const todayStr = new Date().toISOString().split('T')[0];
    const yesterdayStr = new Date(Date.now() - 86400000).toISOString().split('T')[0];

    // Filter out salesLedger transactions from today and yesterday
    salesLedger = salesLedger.filter(s => s.date !== todayStr && s.date !== yesterdayStr);

    // Active orders and unpaid bills from last 2 days
    orders = orders.filter(o => o.time && !o.time.includes(todayStr) && !o.time.includes(yesterdayStr));
    unpaidBills = {};

    // Save updated data to SQLite and server
    await saveToLocal();

    // Delete from Supabase Cloud DB if connected
    if (supabaseClient) {
      try {
        await supabaseClient.from('sales_ledger').delete().in('date', [todayStr, yesterdayStr]);
        await supabaseClient.from('orders').delete().neq('id', '0');
        await supabaseClient.from('unpaid_bills').delete().neq('bill_key', '0');
      } catch (e) {
        console.warn('Supabase purge error:', e);
      }
    }

    if (!silent) {
      closeModal();
      showSection('finance');
      toast('Last 2 days orders & transactions removed completely ✓', 'success');
    }
  } catch (err) {
    console.error('Purge error:', err);
    if (!silent) toast('Purge error: ' + err.message, 'error');
  }
}

function renderFinanceOverview(){
  // ── Live computed stats from real salesLedger & expenseLedger ──
  const today = new Date().toISOString().split('T')[0];
  // Week: Mon–Sun of current week
  const now = new Date();
  const dayOfWeek = now.getDay(); // 0=Sun
  const monday = new Date(now); monday.setDate(now.getDate() - (dayOfWeek===0?6:dayOfWeek-1)); monday.setHours(0,0,0,0);
  const monday_str = monday.toISOString().split('T')[0];
  // Month: first day of current month
  const month_str = today.slice(0,7); // 'YYYY-MM'

  const todaySales  = salesLedger.filter(s=>s.date===today).reduce((a,s)=>a+s.total,0);
  const weekSales   = salesLedger.filter(s=>s.date>=monday_str&&s.date<=today).reduce((a,s)=>a+s.total,0);
  const monthSales  = salesLedger.filter(s=>s.date.startsWith(month_str)).reduce((a,s)=>a+s.total,0);

  // Expenses this month: expenseLedger + petty cash
  const monthExp    = expenseLedger.filter(e=>e.date.startsWith(month_str)).reduce((a,e)=>a+e.amount,0);
  const monthPetty  = pettyCash.filter(p=>p.date.startsWith(month_str)).reduce((a,p)=>a+p.amount,0);
  const totalMonthExp = monthExp + monthPetty;
  const netProfit   = monthSales - totalMonthExp;

  // ── Build last-7-days chart ──
  const last7 = [];
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setDate(now.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    const dayName=d.toLocaleDateString('en-PK',{weekday:'short'});
    const total=salesLedger.filter(s=>s.date===ds).reduce((a,s)=>a+s.total,0);
    last7.push({ds,dayName,total});
  }
  const maxBar=Math.max(...last7.map(d=>d.total),1);

  // ── Expenses breakdown this month ──
  const expCats={};
  expenseLedger.filter(e=>e.date.startsWith(month_str)).forEach(e=>{expCats[e.category]=(expCats[e.category]||0)+e.amount;});
  pettyCash.filter(p=>p.date.startsWith(month_str)).forEach(p=>{expCats['Petty Cash']=(expCats['Petty Cash']||0)+p.amount;});
  const expEntries=Object.entries(expCats).sort((a,b)=>b[1]-a[1]);

  const noSales = salesLedger.length===0;

  return `
  <div class="stats-grid" style="margin-bottom:1.5rem">
    <div class="stat-card">
      <div class="num" style="${todaySales===0?'color:var(--text3)':''}">Rs ${todaySales.toLocaleString()}</div>
      <div class="lbl">Today's Sales</div>
      <div class="sub">${salesLedger.filter(s=>s.date===today).length} transaction(s)</div>
    </div>
    <div class="stat-card">
      <div class="num" style="${weekSales===0?'color:var(--text3)':''}">Rs ${weekSales.toLocaleString()}</div>
      <div class="lbl">This Week</div>
      <div class="sub">${salesLedger.filter(s=>s.date>=monday_str&&s.date<=today).length} transaction(s)</div>
    </div>
    <div class="stat-card">
      <div class="num" style="${monthSales===0?'color:var(--text3)':''}">Rs ${monthSales.toLocaleString()}</div>
      <div class="lbl">This Month</div>
      <div class="sub">${salesLedger.filter(s=>s.date.startsWith(month_str)).length} transaction(s)</div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
    <div class="card card-gold">
      <h3>📊 Last 7 Days Sales</h3>
      ${noSales?`<div style="text-align:center;padding:2rem 1rem;color:var(--text3);font-size:.85rem">No sales recorded yet.<br>Complete a sale to see data here.</div>`:`
      <div class="chart-bar">
        ${last7.map(d=>`<div class="bar-wrap">
          ${d.total>0?`<span class="bar-val" style="font-size:.65rem">Rs ${d.total>=1000?Math.round(d.total/1000)+'K':d.total}</span>`:`<span class="bar-val" style="color:var(--text3);font-size:.65rem">—</span>`}
          <div class="bar" style="height:${Math.max(4,Math.round(d.total/maxBar*120))}px;background:${d.ds===today?'var(--gold2)':'var(--gold)'}"></div>
          <span class="bar-lbl">${d.dayName}</span>
        </div>`).join('')}
      </div>`}
    </div>
    <div class="card card-gold">
      <h3>💸 Expenses This Month</h3>
      ${expEntries.length===0?`<div style="text-align:center;padding:2rem 1rem;color:var(--text3);font-size:.85rem">No expenses recorded yet.</div>`:''}
      ${expEntries.map(([cat,amt])=>{
        const pct=totalMonthExp>0?Math.round(amt/totalMonthExp*100):0;
        return`<div style="margin-bottom:.75rem">
          <div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.25rem">
            <span style="color:var(--text2)">${cat}</span>
            <span style="color:var(--text1)">Rs ${amt.toLocaleString()} <span style="color:var(--text3);font-size:.75rem">(${pct}%)</span></span>
          </div>
          <div class="stock-bar"><div class="stock-fill" style="width:${pct}%;background:var(--gold)"></div></div>

      ${expEntries.length>0?`<div style="border-top:1px solid var(--border2);padding-top:.75rem;margin-top:.5rem;display:flex;justify-content:space-between">
        <strong style="color:var(--text1)">Total Expenses</strong>

    </div>
    <div class="card" style="grid-column:1/-1">

      <div id="date-report-result" style="margin-top:1.25rem">${dateReportFrom&&dateReportTo?buildDateReportHTML(dateReportFrom,dateReportTo):''}</div>

function buildDateReportHTML(from,to){
  const sales=salesLedger.filter(s=>s.date>=from&&s.date<=to);
  const expenses=expenseLedger.filter(e=>e.date>=from&&e.date<=to);
  const petty=pettyCash.filter(p=>p.date>=from&&p.date<=to);

  const totalRevenue=sales.reduce((a,s)=>a+s.total,0);
  const totalExpenses=expenses.reduce((a,e)=>a+e.amount,0);
  const totalPetty=petty.reduce((a,p)=>a+p.amount,0);
  const totalAllExp=totalExpenses+totalPetty;
  const netProfit=totalRevenue-totalAllExp;
  const margin=totalRevenue>0?((netProfit/totalRevenue)*100).toFixed(1):0;

  const byDate={};
  sales.forEach(s=>{
    if(!byDate[s.date])byDate[s.date]={sales:[],total:0};
    byDate[s.date].sales.push(s);
    byDate[s.date].total+=s.total;
  });
  const sortedDates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));

  const payBreakdown={};
  sales.forEach(s=>{payBreakdown[s.payment]=(payBreakdown[s.payment]||0)+s.total;});

  const itemTotals={};
  sales.forEach(s=>s.items.forEach(i=>{itemTotals[i.name]=(itemTotals[i.name]||0)+(i.qty*i.price);}));
  const topItems=Object.entries(itemTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const expCats={};
  expenses.forEach(e=>{expCats[e.category]=(expCats[e.category]||0)+e.amount;});
  const pettyCats={};
  petty.forEach(p=>{pettyCats[p.category]=(pettyCats[p.category]||0)+p.amount;});

  const fmtDate=d=>new Date(d+'T00:00').toLocaleDateString('en-PK',{day:'2-digit',month:'short',year:'numeric'});

function filterPettyCash(cat){pettyCashFilter=cat;showSection('finance');}

async function addPettyEntry(){
  const name=document.getElementById('pc-name').value.trim();
  const amount=+document.getElementById('pc-amount').value;
  const cat=document.getElementById('pc-cat').value;
  const date=document.getElementById('pc-date').value;
  const notes=document.getElementById('pc-notes').value.trim();
  if(!name){toast('Enter expense name','error');return;}
  if(!amount||amount<=0){toast('Enter valid amount','error');return;}
  if(!date){toast('Select a date','error');return;}
  
  if(API_CONNECTED){
    const result = await apiPost('/api/pettycash', {name, category:cat, amount, entryDate:date, notes});
    if(result && result.ok){ await loadFromServer(); toast(name+' — Rs '+amount.toLocaleString()+' added ✓'); showSection('finance'); return; }
  }
  pettyCash.unshift({id:nextPettyId++,name,category:cat,amount,date,notes});
  saveToLocal();
  toast(name+' — Rs '+amount.toLocaleString()+' added ✓');
  showSection('finance');
}

function editPettyEntry(id){
  const e=pettyCash.find(x=>x.id===id);if(!e)return;
  showModal(`<h3>✏ Edit Petty Cash Entry</h3>
  <div style="margin-bottom:.75rem">
    <label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.3rem">Expense Name</label>
    <input class="input-field" style="width:100%" id="epc-name" value="${e.name}">
  </div>
  <div class="form-row">
    <div>
      <label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.3rem">Category</label>
      <select class="input-field" style="width:100%" id="epc-cat">
        ${Object.keys(PETTY_CATS).map(c=>`<option value="${c}"${e.category===c?' selected':''}>${PETTY_CATS[c].icon} ${c}</option>`).join('')}
      </select>
    </div>
    <div>
      <label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.3rem">Amount (Rs)</label>
      <input class="input-field" style="width:100%" id="epc-amount" type="number" value="${e.amount}">
    </div>
  </div>
  <div style="margin-bottom:.75rem">
    <label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.3rem">Date</label>
    <input class="input-field" style="width:100%" id="epc-date" type="date" value="${e.date}">
  </div>
  <div style="margin-bottom:.75rem">
    <label style="font-size:.8rem;color:var(--text2);display:block;margin-bottom:.3rem">Notes</label>
    <input class="input-field" style="width:100%" id="epc-notes" value="${e.notes||''}">
  </div>
  <div class="modal-footer">
    <button class="btn-outline" onclick="closeModal()">Cancel</button>
    <button class="btn-primary" onclick="savePettyEdit(${id})">Save Changes</button>
  </div>`);
}

function savePettyEdit(id){
  const e=pettyCash.find(x=>x.id===id);if(!e)return;
  const name=document.getElementById('epc-name').value.trim();
  const amount=+document.getElementById('epc-amount').value;
  if(!name){toast('Enter expense name','error');return;}
  if(!amount||amount<=0){toast('Enter valid amount','error');return;}
  e.name=name;
  e.category=document.getElementById('epc-cat').value;
  e.amount=amount;
  e.date=document.getElementById('epc-date').value||e.date;
  e.notes=document.getElementById('epc-notes').value.trim();
  saveToLocal();
  closeModal();showSection('finance');toast('Entry updated ✓');
}

function deletePettyEntry(id){
  const e=pettyCash.find(x=>x.id===id);if(!e)return;
  showModal(`<h3 style="color:var(--red)">🗑 Delete Entry</h3>
  <p style="color:var(--text2);margin-bottom:1rem">Delete <strong style="color:var(--text1)">"${e.name}"</strong> (Rs ${e.amount.toLocaleString()})? This cannot be undone.</p>
  <div class="modal-footer">
    <button class="btn-outline" onclick="closeModal()">Cancel</button>
    <button class="btn-sm btn-red" style="padding:.6rem 1.25rem" onclick="confirmDeletePetty(${id})">Delete</button>
  </div>`);
}

function confirmDeletePetty(id){
  pettyCash=pettyCash.filter(x=>x.id!==id);
  saveToLocal();
  closeModal();showSection('finance');toast('Entry deleted');
}

}

function evalPasswordStrength(val){
  const fill=document.getElementById('pwd-strength-fill');
  const lbl=document.getElementById('pwd-strength-lbl');
  if(!fill||!lbl)return;
  let score=0;
  if(val.length>=4)score++;
  if(val.length>=8)score++;
  if(/[A-Z]/.test(val))score++;
  if(/[0-9]/.test(val))score++;
  if(/[^A-Za-z0-9]/.test(val))score++;
  const levels=[
    {w:'0%',   col:'transparent', txt:''},
    {w:'25%',  col:'var(--red)',  txt:'Weak'},
    {w:'50%',  col:'var(--amber)',txt:'Fair'},
    {w:'75%',  col:'var(--blue)', txt:'Good'},
    {w:'100%', col:'var(--green)',txt:'Strong'},
  ];
  const l=levels[Math.min(score,4)];
  fill.style.width=l.w; fill.style.background=l.col;
  lbl.textContent=l.txt; lbl.style.color=l.col;
}

async function saveNewPassword(){
  const current=document.getElementById('cp-current').value;
  const nw=document.getElementById('cp-new').value;
  const confirm=document.getElementById('cp-confirm').value;

  const user = appUsers.find(u => u.username.toLowerCase() === (currentUser || 'admin').toLowerCase());
  const currentPwd = user ? user.password : ADMIN_CRDogarTIALS.password;

  if(!current){toast('Enter your current password','error');return;}
  if(current!==currentPwd){toast('Current password is incorrect','error');return;}
  if(!nw||nw.length<4){toast('New password must be at least 4 characters','error');return;}
  if(nw===current){toast('New password must differ from current password','error');return;}
  if(nw!==confirm){toast('Passwords do not match','error');return;}

  if (user) {
    user.password = nw;
  } else {
    appUsers.push({ username: currentUser || 'admin', password: nw, role: 'Admin', name: 'Master Admin' });
  }
  ADMIN_CRDogarTIALS.password = nw;

  await saveAppUsersLocal();

  closeModal();

function updatePerHeadCalc(){
  const rate=parseFloat(document.getElementById('per-head-rate')?.value)||0;
  const persons=parseInt(document.getElementById('per-head-persons')?.value,10)||0;
  const calcBox=document.getElementById('per-head-calc');
  const calcResult=document.getElementById('per-head-calc-result');
  if(!calcBox||!calcResult)return;
  if(rate>0 && persons>0){
    const total=rate*persons;
    calcResult.textContent=`Rs ${rate.toLocaleString()} × ${persons} = Rs ${total.toLocaleString()}`;
    calcBox.style.display='flex';
  } else {
    calcBox.style.display='none';
  }
}

function updateCashReceivedCalc(totalBill = 0){
  const cashReceived=parseFloat(document.getElementById('cash-received')?.value)||0;
  const calcBox=document.getElementById('change-return-calc');
  const calcResult=document.getElementById('change-return-calc-result');
  if(!calcBox||!calcResult)return;
  if(cashReceived>0){
    const returnAmt=cashReceived - totalBill;
    if(returnAmt>=0){
      calcResult.style.color='var(--green)';
      calcResult.textContent=`Rs ${returnAmt.toLocaleString()}`;
    } else {
      calcResult.style.color='var(--red)';
      calcResult.textContent=`Short by Rs ${Math.abs(returnAmt).toLocaleString()}`;
    }
    calcBox.style.display='flex';
  } else {
    calcBox.style.display='none';
  }
}

function initSupabaseFromStorage() {
  const rawUrl = localStorage.getItem('dogar_supabase_url') || window.SUPABASE_URL || '';
  const key = localStorage.getItem('dogar_supabase_key') || window.SUPABASE_KEY || '';
  const url = rawUrl.replace(/\/rest\/v1\/?$/, '').replace(/\/+$/, '');
  if (window.supabase && url && key && url.includes('supabase.co')) {
    try {
      supabaseClient = window.supabase.createClient(url, key);
      console.log('⚡ Supabase Cloud Database Client Connected ✓');
      setupRealtimeSubscriptions();
      updateCloudBadge(true);
      return true;
    } catch(e) { console.warn('Supabase init failed:', e); }
  }
  updateCloudBadge(false);
  return false;
}

function setupRealtimeSubscriptions() {
  if (!supabaseClient) return;
  try {
    const handleDbChange = async (tableName) => {
      console.log(`🔔 Live ${tableName} change received from Cloud DB`);
      await loadFromLocal();
      if (typeof renderOrders === 'function') renderOrders();
      if (typeof renderTables === 'function') renderTables();
      if (typeof renderMenu === 'function') renderMenu();
      if (typeof renderInventory === 'function') renderInventory();
      if (typeof renderEmployees === 'function') renderEmployees();
      if (typeof renderFinance === 'function') renderFinance();
      if (typeof updateStats === 'function') updateStats();
    };

    supabaseClient
      .channel('hfc-all-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => handleDbChange('orders'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tables' }, () => handleDbChange('tables'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'unpaid_bills' }, () => handleDbChange('unpaid_bills'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'menu_items' }, () => handleDbChange('menu_items'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'menu_categories' }, () => handleDbChange('menu_categories'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'deals' }, () => handleDbChange('deals'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, () => handleDbChange('inventory'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'employees' }, () => handleDbChange('employees'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'petty_cash' }, () => handleDbChange('petty_cash'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'sales_ledger' }, () => handleDbChange('sales_ledger'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'expense_ledger' }, () => handleDbChange('expense_ledger'))
      .subscribe();
  } catch(e) { console.warn('Realtime subscription error:', e); }
}

const SERVER_PORT = 4850;
function getApiBaseUrl() {
  if (window.location.protocol.startsWith('http')) {
    return window.location.origin;
  }
  return `http://localhost:${SERVER_PORT}`;
}

async function apiCall(endpoint, method = 'GET', data = null) {
  try {
    const url = `${getApiBaseUrl()}/api/${endpoint}`;
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (data && method !== 'GET') opts.body = JSON.stringify(data);
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    return null;
  }
}

async function migrateBrowserLocalStorageToApi() {
  try {
    const status = await apiCall('status');
    if (!status || !status.empty) return;

    const localOrd = localStorage.getItem('hfc_web_orders');
    const localMi  = localStorage.getItem('hfc_web_menu_items');
    const localMc  = localStorage.getItem('hfc_web_menu_cats');
    const localTb  = localStorage.getItem('hfc_web_tables');
    const localSl  = localStorage.getItem('hfc_web_sales_ledger');
    const localEl  = localStorage.getItem('hfc_web_expense_ledger');
    const localPc  = localStorage.getItem('hfc_web_petty_cash');
    const localInv = localStorage.getItem('hfc_web_inventory');
    const localEmp = localStorage.getItem('hfc_web_employees');
    const localDl  = localStorage.getItem('hfc_web_deals');
    const localUb  = localStorage.getItem('hfc_web_unpaid_bills');

    const hasAnyData = localOrd || localMi || localMc || localTb || localSl || localEl || localPc || localInv || localEmp || localDl || localUb;
    if (!hasAnyData) return;

    const payload = {};
    if (localOrd) payload.orders = JSON.parse(localOrd);
    if (localMi)  payload.menuItems = JSON.parse(localMi);
    if (localMc)  payload.menuCategories = JSON.parse(localMc);
    if (localTb)  payload.tables = JSON.parse(localTb);
    if (localSl)  payload.salesLedger = JSON.parse(localSl);
    if (localEl)  payload.expenseLedger = JSON.parse(localEl);
    if (localPc)  payload.pettyCash = JSON.parse(localPc);
    if (localInv) payload.inventory = JSON.parse(localInv);
    if (localEmp) payload.employees = JSON.parse(localEmp);
    if (localDl)  payload.deals = JSON.parse(localDl);
    if (localUb)  payload.unpaidBills = JSON.parse(localUb);

    const supUrl = localStorage.getItem('dogar_supabase_url');
    const supKey = localStorage.getItem('dogar_supabase_key');
    if (supUrl || supKey) {
      payload.settings = { supabaseConfig: { url: supUrl || '', key: supKey || '' } };
    }

    console.log('🔄 Preserving Profile A data: Migrating browser localStorage to Central Backend Database...');
    await apiCall('save-all', 'POST', payload);
    console.log('✅ Profile A data migrated successfully to central database!');
  } catch (err) {
    console.warn('Migration warning:', err);
  }
}

async function saveToLocal() {
  try {
    const currentSupConfig = {
      url: localStorage.getItem('dogar_supabase_url') || window.SUPABASE_URL || '',
      key: localStorage.getItem('dogar_supabase_key') || window.SUPABASE_KEY || '',
    };

    // 1. Electron SQLite (Desktop app mode)
    if (window.api && window.api.saveOrders) {
      await Promise.all([
        window.api.saveInventory(inventory),
        window.api.saveEmployees(employees),
        window.api.savePettyCash(pettyCash),
        window.api.saveSalesLedger(salesLedger),
        window.api.saveExpenseLedger(expenseLedger),
        window.api.saveMenuItems(menuItems),
        window.api.saveMenuCategories(menuCategories),
        window.api.saveDeals(deals),
        window.api.saveTables(tables),
        window.api.saveOrders(orders),
        window.api.saveUnpaidBills(unpaidBills),
        window.api.saveAppUsers(appUsers),
        window.api.saveSettings({ nextPettyId, supabaseConfig: currentSupConfig }),
      ]);
      console.log('💾 Data saved to local SQLite database');
    }

    // 2. Central Backend REST API (Web Browser Profile A / Profile B / Mobile)
    await apiCall('save-all', 'POST', {
      inventory, employees, pettyCash, salesLedger, expenseLedger,
      menuItems, menuCategories, deals, tables, orders, unpaidBills, appUsers,
      settings: { nextPettyId, supabaseConfig: currentSupConfig }
    });

    // 3. Supabase Cloud DB (Web app mode / Cross-Device Sync)
    if (supabaseClient) {
      const promises = [];

      // Orders: sync active orders & clean settled/removed orders from Supabase
      const activeOrderIds = (orders || []).map(o => String(o.id));
      if (activeOrderIds.length > 0) {
        const orderRecords = orders.map(o => ({
          id: String(o.id),
          table_id: o.table ?? null,
          items: o.items || [],
          status: o.status || 'pending',
          note: o.note || '',
          time: o.time || '',
          waiter: o.waiter || '',
          is_add_on: !!o.isAddOn,
          total: o.total || 0,
          order_type: o.orderType || 'Dine-in',
          customer_phone: o.customerPhone || '',
          customer_address: o.customerAddress || '',
        }));
        promises.push(supabaseClient.from('orders').upsert(orderRecords));
      } else {
        promises.push(supabaseClient.from('orders').delete().neq('id', '___NONE___'));
      }

      // Tables
      if (tables && tables.length > 0) {
        const tableRecords = tables.map(t => ({
          id: t.id,
          status: t.status || 'available',
          persons: t.persons || 0,
          seats: t.seats || 4,
          reserved_for: t.reservedFor || '',
          reserved_time: t.reservedTime || '',
        }));
        promises.push(supabaseClient.from('tables').upsert(tableRecords));
      }

      // Unpaid Bills: sync active bills & clear settled bills from Supabase
      const activeBillKeys = Object.keys(unpaidBills || {});
      if (activeBillKeys.length > 0) {
        const billRecords = activeBillKeys.map(key => ({
          bill_key: key,
          order_id: String(unpaidBills[key].orderId || key),
          items: unpaidBills[key].items || [],
          time: unpaidBills[key].time || '',
          add_on_tickets: unpaidBills[key].addOnTickets || 0,
        }));
        promises.push(supabaseClient.from('unpaid_bills').upsert(billRecords));
      } else {
        promises.push(supabaseClient.from('unpaid_bills').delete().neq('bill_key', '___NONE___'));
      }

      // Menu Categories
      if (menuCategories && menuCategories.length > 0) {
        promises.push(supabaseClient.from('menu_categories').upsert(menuCategories.map(c => ({ name: c })), { onConflict: 'name' }));
      }

      // Menu Items
      if (menuItems && menuItems.length > 0) {
        promises.push(supabaseClient.from('menu_items').upsert(menuItems.map(m => ({
          id: m.id, name: m.name, cat: m.cat, price: m.price || 0, discount: m.discount || 0,
          desc_text: m.desc || '', img: m.img || '🍕', available: m.available !== false, variants: m.variants || []
        }))));
      }

      // Deals
      if (deals && deals.length > 0) {
        promises.push(supabaseClient.from('deals').upsert(deals.map(d => ({
          id: d.id, name: d.name, category: d.category, items: d.items || [], price: d.price || 0, available: d.available !== false
        }))));
      }

      // Inventory
      if (inventory && inventory.length > 0) {
        promises.push(supabaseClient.from('inventory').upsert(inventory.map(i => ({
          id: i.id, item: i.item || i.name || '', unit: i.unit || '', stock: i.stock || 0, min: i.min || 0, price: i.price || 0, last: i.last || ''
        }))));
      }

      // Employees
      if (employees && employees.length > 0) {
        promises.push(supabaseClient.from('employees').upsert(employees.map(e => ({
          id: e.id, name: e.name, cnic: e.cnic || '', phone: e.phone || '', designation: e.designation || '', salary: e.salary || 0,
          status: e.status || 'Present', address: e.address || '', salary_payments: e.salaryPayments || [], advances: e.advances || [], attendance_log: e.attendanceLog || []
        }))));
      }

      // Petty Cash
      if (pettyCash && pettyCash.length > 0) {
        promises.push(supabaseClient.from('petty_cash').upsert(pettyCash.map(p => ({
          id: p.id, name: p.name || '', category: p.category || 'Misc', amount: p.amount || 0, date: p.date || '', notes: p.notes || ''
        }))));
      }

      // Sales Ledger
      if (salesLedger && salesLedger.length > 0) {
        promises.push(supabaseClient.from('sales_ledger').upsert(salesLedger.map(s => ({
          id: String(s.id), date: s.date || '', table_id: s.table ?? null, items: s.items || [], total: s.total || 0,
          payment: s.payment || '', waiter: s.waiter || '', discount: s.discount || 0, per_head: s.perHead || 0,
          order_type: s.orderType || 'Dine-in', customer_phone: s.customerPhone || '', customer_address: s.customerAddress || ''
        }))));
      }

      // Expense Ledger
      if (expenseLedger && expenseLedger.length > 0) {
        promises.push(supabaseClient.from('expense_ledger').upsert(expenseLedger.map(e => ({
          date: e.date || '', category: e.category || '', amount: e.amount || 0, description: e.description || '', meta: e.meta || {}
        }))));
      }

      // Settings
      promises.push(supabaseClient.from('settings').upsert([
        { key: 'nextPettyId', value: { nextPettyId } }
      ]));

      await Promise.all(promises);
      console.log('☁️ Synced all 12 tables to Supabase Cloud DB ✓');
    }
  } catch(e) { console.warn('Database save warning:', e); }
}

async function loadFromLocal() {
  try {
    let loadedFromCentral = false;

    // 1. Electron SQLite (Desktop app mode)
    if (window.api && window.api.isDbEmpty) {
      await migrateLocalStorageIfNeeded();
      const isDbEmpty = await window.api.isDbEmpty();
      if (!isDbEmpty) {
        const [inv, emp, pc, sl, el, mi, mc, dl, tb, ord, ub, settings, usr] = await Promise.all([
          window.api.getInventory(),
          window.api.getEmployees(),
          window.api.getPettyCash(),
          window.api.getSalesLedger(),
          window.api.getExpenseLedger(),
          window.api.getMenuItems(),
          window.api.getMenuCategories(),
          window.api.getDeals(),
          window.api.getTables(),
          window.api.getOrders(),
          window.api.getUnpaidBills(),
          window.api.getSettings(),
          window.api.getAppUsers(),
        ]);

        if (Array.isArray(inv)) inventory      = inv;
        if (Array.isArray(emp)) employees      = emp;
        if (Array.isArray(pc))  pettyCash      = pc;
        if (Array.isArray(sl))  salesLedger    = sl;
        if (Array.isArray(el))  expenseLedger  = el;
        if (Array.isArray(mi))  menuItems      = mi;
        if (Array.isArray(mc))  menuCategories = mc;
        if (Array.isArray(dl))  deals          = dl;
        if (Array.isArray(tb))  tables         = tb;
        if (Array.isArray(ord)) orders         = ord;
        if (ub && typeof ub === 'object') unpaidBills = ub;
        if (Array.isArray(usr) && usr.length > 0) {
          appUsers = usr;
          const adminUser = appUsers.find(u => u.username.toLowerCase() === 'admin');
          if (adminUser) ADMIN_CRDogarTIALS.password = adminUser.password;
        }
        if (settings && settings.nextPettyId != null) nextPettyId = settings.nextPettyId;
        if (settings && settings.supabaseConfig) {
          if (settings.supabaseConfig.url) window.SUPABASE_URL = settings.supabaseConfig.url;
          if (settings.supabaseConfig.key) window.SUPABASE_KEY = settings.supabaseConfig.key;
        }

        console.log('✅ Loaded data from SQLite database ✓');
        loadedFromCentral = true;
      }
    }

    // 2. Central Backend REST API (Web Browser Mode across Profile A & B)
    if (!loadedFromCentral) {
      await migrateBrowserLocalStorageToApi();
      const res = await apiCall('data');
      if (res && res.success && res.data) {
        const d = res.data;
        if (Array.isArray(d.inventory)) inventory      = d.inventory;
        if (Array.isArray(d.employees)) employees      = d.employees;
        if (Array.isArray(d.pettyCash)) pettyCash      = d.pettyCash;
        if (Array.isArray(d.salesLedger)) salesLedger  = d.salesLedger;
        if (Array.isArray(d.expenseLedger)) expenseLedger = d.expenseLedger;
        if (Array.isArray(d.menuItems)) menuItems      = d.menuItems;
        if (Array.isArray(d.menuCategories)) menuCategories = d.menuCategories;
        if (Array.isArray(d.deals)) deals          = d.deals;
        if (Array.isArray(d.tables)) tables         = d.tables;
        if (Array.isArray(d.orders)) orders         = d.orders;
        if (d.unpaidBills && typeof d.unpaidBills === 'object') unpaidBills = d.unpaidBills;
        if (d.settings && d.settings.nextPettyId != null) nextPettyId = d.settings.nextPettyId;
        if (d.settings && d.settings.supabaseConfig) {
          if (d.settings.supabaseConfig.url) window.SUPABASE_URL = d.settings.supabaseConfig.url;
          if (d.settings.supabaseConfig.key) window.SUPABASE_KEY = d.settings.supabaseConfig.key;
        }

        console.log('✅ Loaded data from Central Backend Database ✓');
        loadedFromCentral = true;
      }
    }

    // 3. Supabase Cloud Sync (Cloud DB)
    if (!supabaseClient) initSupabaseFromStorage();
    if (supabaseClient) {
      const [
        { data: cloudOrders },
        { data: cloudTables },
        { data: cloudBills },
        { data: cloudMenu },
        { data: cloudCats },
        { data: cloudDeals },
        { data: cloudInv },
        { data: cloudEmp },
        { data: cloudPc },
        { data: cloudSales },
        { data: cloudExp },
        { data: cloudSettings }
      ] = await Promise.all([
        supabaseClient.from('orders').select('*').neq('status', 'completed').order('created_at', { ascending: true }),
        supabaseClient.from('tables').select('*').order('id', { ascending: true }),
        supabaseClient.from('unpaid_bills').select('*'),
        supabaseClient.from('menu_items').select('*').order('id', { ascending: true }),
        supabaseClient.from('menu_categories').select('*').order('id', { ascending: true }),
        supabaseClient.from('deals').select('*').order('id', { ascending: true }),
        supabaseClient.from('inventory').select('*').order('id', { ascending: true }),
        supabaseClient.from('employees').select('*').order('id', { ascending: true }),
        supabaseClient.from('petty_cash').select('*').order('id', { ascending: true }),
        supabaseClient.from('sales_ledger').select('*').order('created_at', { ascending: true }),
        supabaseClient.from('expense_ledger').select('*').order('id', { ascending: true }),
        supabaseClient.from('settings').select('*')
      ]);

      if (Array.isArray(cloudOrders)) {
        orders = cloudOrders.map(r => ({
          id: r.id, table: r.table_id, items: r.items || [], status: r.status,
          note: r.note, time: r.time, waiter: r.waiter, isAddOn: !!r.is_add_on, total: r.total,
          orderType: r.order_type || 'Dine-in', customerPhone: r.customer_phone || '',
          customerAddress: r.customer_address || '',
        }));
      }

      if (Array.isArray(cloudTables) && cloudTables.length > 0) {
        tables = cloudTables.map(r => ({
          id: r.id, status: r.status || 'available', persons: r.persons || 0,
          seats: r.seats || 4, reservedFor: r.reserved_for || '', reservedTime: r.reserved_time || '',
        }));
      }

      if (Array.isArray(cloudBills)) {
        const ubObj = {};
        cloudBills.forEach(r => {
          ubObj[r.bill_key] = {
            orderId: r.order_id, items: r.items || [], time: r.time || '', addOnTickets: r.add_on_tickets || 0
          };
        });
        unpaidBills = ubObj;
      }

      if (Array.isArray(cloudMenu) && cloudMenu.length > 0) {
        menuItems = cloudMenu.map(r => ({
          id: r.id, name: r.name, cat: r.cat, price: r.price, discount: r.discount || 0,
          desc: r.desc_text || '', img: r.img || '🍕', available: r.available, variants: r.variants || []
        }));
      }

      if (Array.isArray(cloudCats) && cloudCats.length > 0) {
        menuCategories = cloudCats.map(r => r.name);
      }

      if (Array.isArray(cloudDeals) && cloudDeals.length > 0) {
        deals = cloudDeals.map(r => ({
          id: r.id, name: r.name, category: r.category, items: r.items || [],
          price: r.price, available: r.available
        }));
      }

      if (Array.isArray(cloudInv) && cloudInv.length > 0) {
        inventory = cloudInv.map(r => ({
          id: r.id, item: r.item, unit: r.unit || '', stock: r.stock || 0, min: r.min || 0, price: r.price || 0, last: r.last || ''
        }));
      }

      if (Array.isArray(cloudEmp) && cloudEmp.length > 0) {
        employees = cloudEmp.map(r => ({
          id: r.id, name: r.name, cnic: r.cnic || '', phone: r.phone || '', designation: r.designation || '', salary: r.salary || 0,
          status: r.status || 'Present', address: r.address || '', salaryPayments: r.salary_payments || [], advances: r.advances || [], attendanceLog: r.attendance_log || []
        }));
      }

      if (Array.isArray(cloudPc) && cloudPc.length > 0) {
        pettyCash = cloudPc.map(r => ({
          id: r.id, name: r.name, category: r.category, amount: r.amount || 0, date: r.date || '', notes: r.notes || ''
        }));
      }

      if (Array.isArray(cloudSales) && cloudSales.length > 0) {
        salesLedger = cloudSales.map(r => ({
          id: r.id, date: r.date, table: r.table_id, items: r.items || [], total: r.total, payment: r.payment, waiter: r.waiter,
          discount: r.discount || 0, perHead: r.per_head || 0, orderType: r.order_type || 'Dine-in',
          customerPhone: r.customer_phone || '', customerAddress: r.customer_address || ''
        }));
      }

      if (Array.isArray(cloudExp) && cloudExp.length > 0) {
        expenseLedger = cloudExp.map(r => ({
          id: r.id, date: r.date, category: r.category, amount: r.amount || 0, description: r.description || '', meta: r.meta || {}
        }));
      }

      if (Array.isArray(cloudSettings) && cloudSettings.length > 0) {
        const pSetting = cloudSettings.find(s => s.key === 'nextPettyId');
        if (pSetting && pSetting.value && pSetting.value.nextPettyId) {
          nextPettyId = pSetting.value.nextPettyId;
        }
      }

      console.log('☁️ Loaded all 12 tables from Supabase Cloud DB ✓');
    }
  } catch(e) { console.warn('Database load warning:', e); }
}

async function saveCloudConfig() {
  const url = document.getElementById('cloud-url-input').value.trim();
  const key = document.getElementById('cloud-key-input').value.trim();

  if (!url || !key) {
    showToast('Please enter both Supabase URL and Anon Key', 'warning');
    return;
  }

  localStorage.setItem('dogar_supabase_url', url);
  localStorage.setItem('dogar_supabase_key', key);

  window.SUPABASE_URL = url;
  window.SUPABASE_KEY = key;

  const connected = initSupabaseFromStorage();
  if (connected) {
    showToast('⚡ Cloud DB Connected Successfully!', 'success');
    await loadFromLocal();
    if (typeof renderOrders === 'function') renderOrders();
    if (typeof renderTables === 'function') renderTables();
    if (typeof renderMenu === 'function') renderMenu();
    closeModal();
  } else {
    showToast('❌ Connection Failed! Check URL & Key', 'error');
  }
}

async function pushAllDataToCloud() {
  if (!supabaseClient) {
    showToast('Please connect to Supabase Cloud DB first!', 'warning');
    return;
  }

  try {
    showToast('⏳ Syncing all local data to Cloud DB...', 'info');

    // Menu Categories
    if (menuCategories && menuCategories.length > 0) {
      await supabaseClient.from('menu_categories').upsert(menuCategories.map(c => ({ name: c })), { onConflict: 'name' });
    }

    // Menu Items
    if (menuItems && menuItems.length > 0) {
      await supabaseClient.from('menu_items').upsert(menuItems.map(m => ({
        id: m.id, name: m.name, cat: m.cat, price: m.price || 0, discount: m.discount || 0,
        desc_text: m.desc || '', img: m.img || '🍕', available: m.available !== false, variants: m.variants || []
      })));
    }

    // Deals
    if (deals && deals.length > 0) {
      await supabaseClient.from('deals').upsert(deals.map(d => ({
        id: d.id, name: d.name, category: d.category, items: d.items || [], price: d.price || 0, available: d.available !== false
      })));
    }

    // Tables
    if (tables && tables.length > 0) {
      await supabaseClient.from('tables').upsert(tables.map(t => ({
        id: t.id, status: t.status || 'available', persons: t.persons || 0, seats: t.seats || 4,
        reserved_for: t.reservedFor || '', reserved_time: t.reservedTime || ''
      })));
    }

    // Orders
    if (orders && orders.length > 0) {
      await supabaseClient.from('orders').upsert(orders.map(o => ({
        id: String(o.id), table_id: o.table ?? null, items: o.items || [], status: o.status || 'pending',
        note: o.note || '', time: o.time || '', waiter: o.waiter || '', is_add_on: !!o.isAddOn,
        total: o.total || 0, order_type: o.orderType || 'Dine-in', customer_phone: o.customerPhone || '',
        customer_address: o.customerAddress || ''
      })));
    }

    // Inventory
    if (inventory && inventory.length > 0) {
      await supabaseClient.from('inventory').upsert(inventory.map(i => ({
        id: i.id, item: i.item || i.name || '', unit: i.unit || '', stock: i.stock || 0, min: i.min || 0, price: i.price || 0, last: i.last || ''
      })));
    }

    // Employees
    if (employees && employees.length > 0) {
      await supabaseClient.from('employees').upsert(employees.map(e => ({
        id: e.id, name: e.name, cnic: e.cnic || '', phone: e.phone || '', designation: e.designation || '', salary: e.salary || 0,
        status: e.status || 'Present', address: e.address || '', salary_payments: e.salaryPayments || [], advances: e.advances || [], attendance_log: e.attendanceLog || []
      })));
    }

    // Petty Cash
    if (pettyCash && pettyCash.length > 0) {
      await supabaseClient.from('petty_cash').upsert(pettyCash.map(p => ({
        id: p.id, name: p.name || '', category: p.category || 'Misc', amount: p.amount || 0, date: p.date || '', notes: p.notes || ''
      })));
    }

    // Sales Ledger
    if (salesLedger && salesLedger.length > 0) {
      await supabaseClient.from('sales_ledger').upsert(salesLedger.map(s => ({
        id: String(s.id), date: s.date || '', table_id: s.table ?? null, items: s.items || [], total: s.total || 0,
        payment: s.payment || '', waiter: s.waiter || '', discount: s.discount || 0, per_head: s.perHead || 0,
        order_type: s.orderType || 'Dine-in', customer_phone: s.customerPhone || '', customer_address: s.customerAddress || ''
      })));
    }

    // Expense Ledger
    if (expenseLedger && expenseLedger.length > 0) {
      await supabaseClient.from('expense_ledger').upsert(expenseLedger.map(e => ({
        date: e.date || '', category: e.category || '', amount: e.amount || 0, description: e.description || '', meta: e.meta || {}
      })));
    }

    // Settings
    await supabaseClient.from('settings').upsert([
      { key: 'nextPettyId', value: { nextPettyId } }
    ]);

    showToast('✅ All Local Data Successfully Pushed to Cloud Database!', 'success');
  } catch(e) {
    console.error('Push to cloud error:', e);
    showToast('Failed to push data to Cloud DB', 'error');
  }
}

// ── Auto Background Sync every 45 seconds ──
setInterval(() => {

      if (typeof renderOrders === 'function') renderOrders();
      if (typeof renderTables === 'function') renderTables();
    }).catch(err => console.warn('Periodic sync background error:', err));
  }
}, 45000);

// ── ONE-TIME MIGRATION: old localStorage data → SQLite ──
// Runs once per install; marks itself done afterwards so it never re-runs
// and never overwrites real database data with a stale old snapshot.
const LEGACY_LOCALSTORAGE_KEYS = [
  'db_inventory','db_employees','db_pettyCash','db_salesLedger','db_expenseLedger',
  'db_menuItems','db_menuCats','db_tables','db_orders','db_unpaidBills','db_nextPettyId',
];

async function migrateLocalStorageIfNeeded(){
  try {
    if (localStorage.getItem('db_migrated_to_sqlite') === 'true') return;

    const hasLegacyData = LEGACY_LOCALSTORAGE_KEYS.some(k => localStorage.getItem(k) !== null);
    if (!hasLegacyData) { localStorage.setItem('db_migrated_to_sqlite', 'true'); return; }

    // Don't clobber real database data with an old localStorage snapshot —
    // only migrate into a database that's never been written to.
    const isDbEmpty = await window.api.isDbEmpty();
    if (!isDbEmpty) { localStorage.setItem('db_migrated_to_sqlite', 'true'); return; }

    const legacy = {
      inventory:      JSON.parse(localStorage.getItem('db_inventory')     || '[]'),
      employees:      JSON.parse(localStorage.getItem('db_employees')     || '[]'),
      pettyCash:      JSON.parse(localStorage.getItem('db_pettyCash')     || '[]'),
      salesLedger:    JSON.parse(localStorage.getItem('db_salesLedger')   || '[]'),
      expenseLedger:  JSON.parse(localStorage.getItem('db_expenseLedger') || '[]'),
      menuItems:      JSON.parse(localStorage.getItem('db_menuItems')     || '[]'),
      menuCategories: JSON.parse(localStorage.getItem('db_menuCats')      || '[]'),
      tables:         JSON.parse(localStorage.getItem('db_tables')        || '[]'),
      orders:         JSON.parse(localStorage.getItem('db_orders')        || '[]'),
      unpaidBills:    JSON.parse(localStorage.getItem('db_unpaidBills')   || '{}'),
      settings: {
        nextPettyId: parseInt(localStorage.getItem('db_nextPettyId')) || 7,
      },
    };

    await window.api.migrateFromLocalStorage(legacy);

    // Migration succeeded — the old copy is now redundant, clear it so the
    // app no longer depends on (or reads from) localStorage at all.
    LEGACY_LOCALSTORAGE_KEYS.forEach(k => localStorage.removeItem(k));
    localStorage.setItem('db_migrated_to_sqlite', 'true');
    console.log('✅ One-time migration: localStorage data copied into SQLite');
  } catch(e) { console.warn('localStorage → SQLite migration failed:', e); }
}

// Automatically load data on boot
document.addEventListener('DOMContentLoaded', () => {
  loadFromLocal().catch(e => console.warn('Initial DB load error:', e));
});
